name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          mkdir _site
          pandoc od_blokirajuceg_io_do_io_uringa.md --standalone --no-highlight --metadata lang=sr-Latn --metadata pagetitle="Od blokirajućeg I/O-a do io_uring-a" --css=style.css -o _site/index.html
          cp -r dijagrami style.css _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
